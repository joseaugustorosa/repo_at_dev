<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Agendamento</title>
  <style>:root { --bg:#f6f7f9; --fg:#1b2430; --muted:#5b6675; --card:#fff; --line:#dde2e9; --accent:#0b6bcb; --danger:#b42318; }
* { box-sizing: border-box; }
body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:var(--accent); color:#fff; }
.brand { font-weight:600; }
.topbar .who { margin-right:12px; }
main { max-width:960px; margin:24px auto; padding:0 16px; }
h1 { font-size:1.4rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:24px; }
.narrow { max-width:380px; margin:48px auto; }
label { display:block; margin:12px 0; font-size:.9rem; color:var(--muted); }
input { display:block; width:100%; margin-top:4px; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
button { padding:8px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
button.link { background:none; text-decoration:underline; padding:0; color:#fff; }
form.inline { display:flex; gap:8px; align-items:flex-end; }
form.inline label { margin:0; }
form.inline input { width:auto; }
table { width:100%; border-collapse:collapse; margin-top:16px; background:var(--card); border:1px solid var(--line); }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
th { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.status { padding:2px 8px; border-radius:999px; font-size:.8rem; background:#e8f1fd; }
.status.cancelada { background:#fde8e8; color:var(--danger); }
.status.concluida { background:#e6f4ea; color:#1e6b3a; }
.alert { padding:8px 12px; border-radius:6px; background:#fde8e8; color:var(--danger); }
.empty { color:var(--muted); margin-top:24px; }
footer { text-align:center; color:var(--muted); font-size:.8rem; padding:24px; }
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Clínica · Agendamento</span>
    
  </header>
  <main>
    
<section class="card narrow">
  <h1>Entrar</h1>
  
  <form method="post" action="/web/login" autocomplete="off">
    <input type="hidden" name="csrf_token" value="qqO2TSfezwy9ayL7B1btOR1yc0JOVBvf2bSNn1sQwT8">
    <label>E-mail <input type="email" name="username" required maxlength="254" autocomplete="username"></label>
    <label>Senha <input type="password" name="password" required maxlength="72" autocomplete="current-password"></label>
    <label>Código MFA <small>(somente contas administrativas)</small>
      <input type="text" name="mfa_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
    </label>
    <button type="submit">Entrar</button>
  </form>
</section>

  </main>
  <footer>Uso interno. Contém dados pessoais protegidos pela LGPD — não compartilhe capturas de tela.</footer>
</body>
</html>
