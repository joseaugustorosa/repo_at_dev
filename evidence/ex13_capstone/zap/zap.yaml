env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://host.docker.internal:8000/web/login
    - http://host.docker.internal:8000/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: http://host.docker.internal:8000/
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: FAIL
    customMessage: ''
    id: 10020
  - action: FAIL
    customMessage: ''
    id: 10021
  - action: FAIL
    customMessage: ''
    id: 10035
  - action: FAIL
    customMessage: ''
    id: 10038
  - action: FAIL
    customMessage: ''
    id: 10098
  - action: FAIL
    customMessage: ''
    id: 10010
  - action: FAIL
    customMessage: ''
    id: 10011
  - action: FAIL
    customMessage: ''
    id: 10054
  - action: FAIL
    customMessage: ''
    id: 10202
  - action: FAIL
    customMessage: ''
    id: 10036
  - action: FAIL
    customMessage: ''
    id: 10037
  - action: FAIL
    customMessage: ''
    id: 90022
  - action: IGNORE
    customMessage: ''
    id: 10096
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: baseline_web_report.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: baseline_web_report.md
    reportTitle: ZAP Scanning Report
    template: traditional-md
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: baseline_web_report.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
