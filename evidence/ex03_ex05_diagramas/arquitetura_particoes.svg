ntrato OpenAPI auditado</tspan></text><rect x='435' y='735' width='390' height='100' rx='6' fill='#ffffff' stroke='#1e8449' stroke-width='1.6'/><text x='630.0' y='789.55' font-size='13' font-weight='normal' text-anchor='middle' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='630.0' dy='0.0'></tspan></text><text x='447' y='757' font-size='13' font-weight='bold' text-anchor='start' fill='#1e8449' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='447' dy='0.0'>2 · IMPLEMENTAÇÃO</tspan></text><text x='447' y='777' font-size='11.5' font-weight='normal' text-anchor='start' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='447' dy='0.0'>validação whitelist + extra=&#x27;forbid&#x27;; queries parametrizadas;</tspan><tspan x='447' dy='14.4'>autoescape; bcrypt; JWT estrito; sem segredo no código;</tspan><tspan x='447' dy='14.4'>testes derivados do threat model</tspan></text><rect x='840' y='735' width='390' height='100' rx='6' fill='#ffffff' stroke='#d68910' stroke-width='1.6'/><text x='1035.0' y='789.55' font-size='13' font-weight='normal' text-anchor='middle' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='1035.0' dy='0.0'></tspan></text><text x='852' y='757' font-size='13' font-weight='bold' text-anchor='start' fill='#d68910' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='852' dy='0.0'>3 · INFRAESTRUTURA</tspan></text><text x='852' y='777' font-size='11.5' font-weight='normal' text-anchor='start' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='852' dy='0.0'>TLS/HSTS no proxy; CORS allowlist; headers; rate limit</tspan><tspan x='852' dy='14.4'>(Redis se &gt;1 réplica); .env/secret manager; docs desligadas</tspan><tspan x='852' dy='14.4'>em produção; logs para SIEM</tspan></text></svg>