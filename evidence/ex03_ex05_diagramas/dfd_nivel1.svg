pan></text><rect x='450' y='100' width='250' height='110' rx='40' fill='#eef5fc' stroke='#222' stroke-width='1.6'/><text x='575.0' y='136.88' font-size='12' font-weight='normal' text-anchor='middle' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='575.0' dy='0.0'>P1 · Autenticação</tspan><tspan x='575.0' dy='15.0'>/user/signin · /user/mfa/verify</tspan><tspan x='575.0' dy='15.0'>/oauth/token</tspan><tspan x='575.0' dy='15.0'>bcrypt · TOTP · emissão de JWT</tspan></text><rect x='450' y='270' width='250' height='110' rx='40' fill='#eef5fc' stroke='#222' stroke-width='1.6'/><text x='575.0' y='306.88' font-size='12' font-weight='normal' text-anchor='middle' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='575.0' dy='0.0'>P2 · Pacientes e Consultas</tspan><tspan x='575.0' dy='15.0'>/patient · /appointment</tspan><tspan x='575.0' dy='15.0'>RBAC + ownership na query</tspan><tspan x='575.0' dy='15.0'>response models (whitelist)</tspan></text><rect x='450' y='440' width='250' height='100' rx='40' fill='#eef5fc' stroke='#222' stroke-width='1.6'/><text x='575.0' y='479.32' font-size='12' font-weight='normal' text-anchor='middle' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='575.0' dy='0.0'>P3 · Página da recepção</tspan><tspan x='575.0' dy='15.0'>/web/login · /web/agenda</tspan><tspan x='575.0' dy='15.0'>Jinja2 autoescape · CSP · CSRF</tspan></text><rect x='450' y='600' width='250' height='100' rx='40' fill='#eef5fc' stroke='#222' stroke-width='1.6'/><text x='575.0' y='639.32' font-size='12' font-weight='normal' text-anchor='middle' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='575.0' dy='0.0'>P4 · Disponibilidade</tspan><tspan x='575.0' dy='15.0'>/availability (availability:read)</tspan><tspan x='575.0' dy='15.0'>só horários — sem PHI</tspan></text><rect x='850' y='215' width='195' height='430' rx='10' fill='