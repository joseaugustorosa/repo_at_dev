ensíveis de pacientes: ② ④ e</tspan><tspan x='30' dy='13.8'>P2/P3 → D1. Exigem ownership,</tspan><tspan x='30' dy='13.8'>response model e cache no-store.</tspan></text><line x1='40' y1='805' x2='74' y2='805' stroke='#c0392b' stroke-width='3'/><text x='82' y='809' font-size='11' font-weight='normal' text-anchor='start' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='82' dy='0.0'>dado de saúde / dado pessoal (PHI/PII: CPF, prontuário)</tspan></text><line x1='420.0' y1='805' x2='454.0' y2='805' stroke='#d68910' stroke-width='3'/><text x='462.0' y='809' font-size='11' font-weight='normal' text-anchor='start' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='462.0' dy='0.0'>credenciais e segredos (senha, TOTP, client_secret)</tspan></text><line x1='777.5999999999999' y1='805' x2='811.5999999999999' y2='805' stroke='#1f6fb2' stroke-width='3'/><text x='819.5999999999999' y='809' font-size='11' font-weight='normal' text-anchor='start' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='819.5999999999999' dy='0.0'>tokens (JWT access / m2m)</tspan></text><line x1='989.5999999999999' y1='805' x2='1023.5999999999999' y2='805' stroke='#6b7785' stroke-width='3'/><text x='1031.6' y='809' font-size='11' font-weight='normal' text-anchor='start' fill='#222' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='1031.6' dy='0.0'>metadados / eventos sem dado sensível</tspan></text><text x='40' y='831' font-size='11' font-weight='normal' text-anchor='start' fill='#6b7785' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='40' dy='0.0'>Setas de resposta omitidas: todo fluxo é bidirecional. Linha tracejada vermelha = fronteira de confiança (trust boundary).</tspan></text></svg>