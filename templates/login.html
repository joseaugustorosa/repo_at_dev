{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Entrar</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/web/login" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>E-mail <input type="email" name="username" required maxlength="254" autocomplete="username"></label>
    <label>Senha <input type="password" name="password" required maxlength="72" autocomplete="current-password"></label>
    <label>Código MFA <small>(somente contas administrativas)</small>
      <input type="text" name="mfa_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
    </label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
